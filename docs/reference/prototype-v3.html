<title>Finora Financial Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sidebar + dashboard grid on desktop, bottom navigation on phones. Palette: deep ink navy, azure accent, ledger green/coral for money direction. Type: Bricolage Grotesque (numbers/headings) + Plus Jakarta Sans (UI). */
:root{
  --font-d:'Bricolage Grotesque','Plus Jakarta Sans',system-ui,sans-serif;
  --font-b:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r-sm:12px;--r-md:16px;--r-lg:24px;--r-pill:999px;
  /* LIGHT: neutral page, white cards, ink text, lime accent */
  --bg:#f5f5f2;--surface:#ffffff;--surface2:#f0f0ec;--line:#e6e6e0;--fg:#121311;--muted:#6a6d64;
  --accent:#d6fb4f;--accent-fg:#121311;--accent-strong:#9ccc1d;--accent-text:#445f00;--accent-soft:#eaf8bd;--focus:#121311;
  --pos:#25781f;--pos-soft:#e1f4d4;--neg:#d2326a;--neg-soft:#fde6ee;--warn:#9a5d00;--warn-soft:#fdeed0;--warn-bar:#e0a030;
  --hero:#121311;--hero-fg:#ffffff;--hero-mut:rgba(255,255,255,.62);--hero-line:rgba(255,255,255,.08);--hero-chip:rgba(255,255,255,.1);--hero-pos:#d6fb4f;--hero-neg:#ff86b8;--hero-edge:#121311;
  --shadow:0 1px 2px rgba(18,19,17,.04),0 10px 30px rgba(18,19,17,.06);--glow:0 8px 22px rgba(156,204,29,.38);
  --shadow-pop:0 -8px 36px rgba(18,19,17,.12);--nav-bg:rgba(255,255,255,.95);--fab-shadow:0 10px 26px rgba(156,204,29,.5);
  --page-bg:#f5f5f2;--overlay:rgba(12,13,10,.46);--badge-l:34%;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0c0a;--surface:#151713;--surface2:#1e211b;--line:#2a2d25;--fg:#f4f5ef;--muted:#989c8f;
  --accent:#d6fb4f;--accent-fg:#121311;--accent-strong:#d6fb4f;--accent-text:#d6fb4f;--accent-soft:#252e0f;--focus:#d6fb4f;
  --pos:#c9f35a;--pos-soft:#232c0e;--neg:#ff86b8;--neg-soft:#34151f;--warn:#f5b84a;--warn-soft:#2e2511;--warn-bar:#e0a030;
  --hero:#20231c;--hero-fg:#ffffff;--hero-mut:rgba(255,255,255,.62);--hero-line:rgba(255,255,255,.07);--hero-chip:rgba(255,255,255,.1);--hero-pos:#d6fb4f;--hero-neg:#ff86b8;--hero-edge:#2f332a;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 32px rgba(0,0,0,.4);--glow:0 8px 22px rgba(214,251,79,.22);
  --shadow-pop:0 -10px 40px rgba(0,0,0,.55);--nav-bg:rgba(24,27,21,.95);--fab-shadow:0 10px 28px rgba(214,251,79,.32);
  --page-bg:#0b0c0a;--overlay:rgba(0,0,0,.68);--badge-l:72%;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0c0a;--surface:#151713;--surface2:#1e211b;--line:#2a2d25;--fg:#f4f5ef;--muted:#989c8f;
  --accent:#d6fb4f;--accent-fg:#121311;--accent-strong:#d6fb4f;--accent-text:#d6fb4f;--accent-soft:#252e0f;--focus:#d6fb4f;
  --pos:#c9f35a;--pos-soft:#232c0e;--neg:#ff86b8;--neg-soft:#34151f;--warn:#f5b84a;--warn-soft:#2e2511;--warn-bar:#e0a030;
  --hero:#20231c;--hero-fg:#ffffff;--hero-mut:rgba(255,255,255,.62);--hero-line:rgba(255,255,255,.07);--hero-chip:rgba(255,255,255,.1);--hero-pos:#d6fb4f;--hero-neg:#ff86b8;--hero-edge:#2f332a;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 32px rgba(0,0,0,.4);--glow:0 8px 22px rgba(214,251,79,.22);
  --shadow-pop:0 -10px 40px rgba(0,0,0,.55);--nav-bg:rgba(24,27,21,.95);--fab-shadow:0 10px 28px rgba(214,251,79,.32);
  --page-bg:#0b0c0a;--overlay:rgba(0,0,0,.68);--badge-l:72%;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
html{background:var(--bg)}

*{box-sizing:border-box}
body{background:var(--page-bg);color:var(--fg);font-family:var(--font-b);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--font-d);text-wrap:balance;letter-spacing:-.01em;line-height:1.2}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
small{font-size:12px;color:var(--muted)}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:start;padding:20px 12px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);background:var(--surface);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 18px;font-family:var(--font-d);font-weight:700;font-size:21px;letter-spacing:-.02em}
.brand i{width:32px;height:32px;border-radius:10px;background:var(--hero);display:grid;place-items:center;color:var(--hero-fg)}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;color:var(--muted);font-weight:600}
.nav:hover{background:var(--surface2);color:var(--fg)}
.nav.on{background:var(--accent-soft);color:var(--accent-text)}
.side-foot{margin-top:auto;padding:12px;font-size:12px;color:var(--muted)}
.main{padding-block:20px 80px;padding-inline:clamp(16px,3vw,36px);min-width:0;max-width:1320px;width:100%}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:clamp(24px,3.4vw,32px);font-weight:700;margin-right:auto}
.mnav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.mnav b{min-width:122px;text-align:center;font-weight:600;font-size:13.5px}
.icon-btn{width:36px;height:36px;border-radius:10px;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface2);color:var(--fg)}
.top .icon-btn.bd{background:var(--surface);border:1px solid var(--line)}
.ic{display:block;flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);min-height:40px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent-text)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:6px 12px;min-height:32px;font-size:13px;border-radius:10px}
.btn.dng{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 40%,var(--line))}
.btn.dng.arm{background:var(--neg);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent-text)}

.bnav{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card h3{font-size:16px;font-weight:700}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ch a,.ch .lnk{color:var(--accent-text);font-weight:600;font-size:13px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.stats.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat small{display:block;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:11px}
.stat b{display:block;font-family:var(--font-d);font-size:clamp(18px,2.2vw,23px);margin-top:4px;overflow-wrap:break-word}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.sp{flex:1;min-width:0}
.wrap{flex-wrap:wrap}

.hero{background:var(--hero);color:var(--hero-fg);border:0;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px}
.hero small{color:var(--hero-mut)}
.hero .big{font-family:var(--font-d);font-weight:700;font-size:clamp(30px,4.2vw,42px);letter-spacing:-.02em;white-space:nowrap}
.hero svg.deco{position:absolute;right:-60px;top:-60px;opacity:.9;pointer-events:none}
.hero.hero-row{flex-direction:row;align-items:center;flex-wrap:wrap;gap:16px 20px}
.hero.hero-row .sp{flex:1 1 260px}
.hero.hero-row .row{flex:0 0 auto}
.hero .mini{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--hero-line)}
.hero .mini div{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.hero .mini span:first-child{color:var(--hero-mut)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
button.chip:hover{background:var(--accent-soft);color:var(--accent-text)}
.chip.on{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
.hero .chip{background:rgba(255,255,255,.1);border-color:transparent;color:var(--hero-fg)}
.pill{font-style:normal;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.paid{background:var(--pos-soft);color:var(--pos)}
.pill.late{background:var(--neg-soft);color:var(--neg)}
.pill.today{background:var(--warn-soft);color:var(--warn)}
.pill.soon{background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--pos-soft);color:var(--pos)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--neg-soft);color:var(--neg)}
.dl{font-size:12px;font-weight:600}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0;width:100%}
.li:last-child{border-bottom:0}
button.li:hover,.up:hover{background:var(--surface2)}
.li .t{flex:1;min-width:0;display:flex;flex-direction:column}
.li .t b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;flex:none}
.li .r b{font-weight:700}
.cbadge{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 17%,var(--surface));color:var(--c);flex:none}
.cbadge.neu{background:var(--surface2);color:var(--muted)}
.dh{display:flex;justify-content:space-between;padding:14px 0 4px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.up{display:flex;align-items:center;gap:12px;width:100%;padding:10px 8px;margin-inline:-8px;width:calc(100% + 16px);border-radius:12px}
.up-t{flex:1;min-width:0;display:flex;flex-direction:column}
.up-t b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up-r{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.up-r b{font-size:13.5px}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;overflow:hidden;flex:none;background:hsl(var(--h) 60% 50%/.16);color:hsl(var(--h) 65% var(--badge-l));font-weight:700;font-size:13px;letter-spacing:.02em}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.logo.sm{width:22px;height:22px;border-radius:7px;font-size:9px}
.logo.lg{width:56px;height:56px;border-radius:16px;font-size:18px}

/* bars */
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent-strong)}
.bar i.ok{background:var(--pos)}.bar i.warn{background:var(--warn-bar)}.bar i.bad{background:var(--neg)}
.bar .mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg);opacity:.45}
.brow{display:flex;flex-direction:column;gap:7px;padding:11px 0;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow .h{display:flex;justify-content:space-between;gap:10px;align-items:center}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.gl{stroke:var(--line);stroke-width:1;fill:none}
.ax{fill:var(--muted);font-size:12.5px;font-family:var(--font-b)}
.ln{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ln.inc{stroke:var(--pos)}.ln.exp{stroke:var(--neg)}.ln.acc{stroke:var(--accent-strong)}
.inc-f{fill:var(--pos);opacity:.13}.acc-f{fill:var(--accent-strong);opacity:.13}
.dot{stroke:var(--surface);stroke-width:2.5}
.dot.inc{fill:var(--pos)}.dot.exp{fill:var(--neg)}.dot.acc{fill:var(--accent-strong)}
.bi{fill:var(--pos)}.be{fill:var(--neg)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut{width:150px;height:150px;flex:none}
.dc1{font-family:var(--font-d);font-weight:700;font-size:5px;fill:var(--fg)}
.dc2{font-size:2.6px;fill:var(--muted)}
.dwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.dleg{flex:1;min-width:150px;display:flex;flex-direction:column;gap:8px}
.dleg div{display:flex;align-items:center;gap:8px;font-size:13px}
.dleg i{width:10px;height:10px;border-radius:3px;flex:none}
.dleg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* forms */
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.fld>span,.lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--fg);font:inherit;min-height:42px}
.inp:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.inp.big{font-family:var(--font-d);font-size:26px;font-weight:700;padding:12px 14px}
textarea.inp{resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two>*{min-width:0}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;margin-bottom:14px;gap:2px}
.seg button{flex:1;padding:8px 6px;border-radius:10px;font-weight:600;text-align:center;color:var(--muted);font-size:13.5px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 14px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw label{cursor:pointer}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw span{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw input:checked+span{box-shadow:0 0 0 2px var(--fg)}
.sw input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.sw span svg{opacity:0}.sw input:checked+span svg{opacity:1}
.ckrow{display:flex;gap:10px;align-items:center;font-weight:500}
.ckrow input{width:18px;height:18px;accent-color:var(--accent-text)}
.foot{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.foot .sp{flex:1}
.hint{font-size:12px;color:var(--muted);margin-top:-8px;margin-bottom:14px}
.rcp{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.rcp img{width:64px;height:64px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.filefld{position:relative}
.filefld input[type=file]{font-size:13px;max-width:100%}
.split{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center}
.split>*{min-width:0}

/* modal + toast */
.overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.sheet{width:min(580px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--surface);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.35);border:1px solid var(--line)}
.sheet.wide{width:min(760px,100%)}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px;position:sticky;top:0;background:var(--surface);z-index:1}
.sh-h h2{font-size:20px}
.sh-b{padding:10px 18px 18px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:14px;margin-bottom:14px;font-size:13.5px}
.banner.info{background:var(--accent-soft);color:var(--accent-text)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner b{font-weight:700}
.banner .sp{flex:1 1 220px}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty h3{color:var(--fg);margin-bottom:6px}

/* calendar */
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;width:max-content;max-width:100%}
.tabs button{padding:7px 16px;border-radius:9px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--accent-soft);color:var(--accent-text)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .dw{font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:.05em}
.cell{display:flex;flex-direction:column;gap:4px;min-height:86px;padding:6px;border-radius:12px;background:var(--surface2);border:1px solid transparent;text-align:left;min-width:0}
.cell:hover{border-color:var(--line)}
.cell.out{background:transparent;pointer-events:none}
.cell.sel{border-color:var(--accent-text);background:var(--accent-soft)}
.cell .dn{font-weight:700;font-size:12.5px;display:flex;justify-content:space-between;align-items:center}
.cell.today .dn span{background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:0 7px}
.cell .cl{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.cell .more{font-size:10.5px;font-weight:700;color:var(--muted)}
.mk-in{width:8px;height:8px;border-radius:50%;background:var(--pos);display:inline-block}
.mk-goal{width:8px;height:8px;border-radius:2px;background:var(--accent);display:inline-block}
.day-ev{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.day-ev:last-child{border-bottom:0}

const acc=id=>S.accounts.find(a=>a.id===id);
const accCur=id=>{const a=acc(id);return a?a.currency:S.settings.base};
const cat=id=>S.cats.find(c=>c.id===id)||{id:'none',name:'Tanpa kategori',icon:'dots',color:'#8a96ad',type:'expense'};
function accBalances(upTo,D){D=D||S;const b={};D.accounts.forEach(a=>b[a.id]=+a.opening||0);
  for(const t of D.tx){if(upTo&&t.date>upTo)continue;
    if(t.type==='income'){if(t.accountId in b)b[t.accountId]+=t.amount}
    else if(t.type==='expense'){if(t.accountId in b)b[t.accountId]-=t.amount}
    else{if(t.accountId in b)b[t.accountId]-=t.amount+(t.fee||0);if(t.toAccountId&&t.toAccountId in b)b[t.toAccountId]+=(t.toAmount!=null?t.toAmount:t.amount)}}
  return b}
const parts=t=>(t.splits&&t.splits.length)?t.splits:[{catId:t.catId,amount:t.amount}];
function monthStats(m,maxDay){const r={income:0,expense:0,byCat:{},incCat:{}};
  for(const t of S.tx){if(t.date.slice(0,7)!==m)continue;if(maxDay&&+t.date.slice(8)>maxDay)continue;const c=accCur(t.accountId);
    if(t.type==='income'){const v=toBase(t.amount,c);r.income+=v;r.incCat[t.catId]=(r.incCat[t.catId]||0)+v}
    else if(t.type==='expense'){for(const p of parts(t)){const v=toBase(p.amount,c);r.expense+=v;r.byCat[p.catId]=(r.byCat[p.catId]||0)+v}}
    else if(t.fee>0){const v=toBase(t.fee,c);r.expense+=v;r.byCat.fees=(r.byCat.fees||0)+v}}
  r.net=r.income-r.expense;r.rate=r.income>0?r.net/r.income:null;return r}
function totals(){const bal=accBalances();let liquid=0,savings=0,credit=0,all=0;
  for(const a of S.accounts){const v=toBase(bal[a.id],a.currency);if(a.type==='credit')credit+=v;else{all+=v;if(a.type==='savings')savings+=v;else liquid+=v}}
  return{bal,liquid,savings,credit,all}}
function advance(d,freq,anchor){if(freq==='weekly')return addDays(d,7);
  if(freq==='monthly'){const m=addMonthsYM(d.slice(0,7),1);return m+'-'+pad(Math.min(anchor,daysIn(m)))}
  if(freq==='yearly'){const m=addMonthsYM(d.slice(0,7),12);return m+'-'+pad(Math.min(anchor,daysIn(m)))}
  return '9999-12-31'}
function occurrences(it,from,to){const out=[];const st=it.start;
  if(it.freq==='once')return(st>=from&&st<=to)?[st]:[];
  const anchor=+st.slice(8,10);let d=st,n=0;
  while(d<=to&&n<1500){if(d>=from&&(!it.end||d<=it.end))out.push(d);d=advance(d,it.freq,anchor);n++}
  return out}
function runRecurring(){let created=0;const T=today();
  for(const r of S.recurring){let n=0;while(r.next<=T&&(!r.end||r.next<=r.end)&&n<400){
    S.tx.push(Object.assign({id:uid(),date:r.next,fee:0,note:'',recId:r.id},r.tpl));created++;r.next=advance(r.next,r.freq,r.anchor);n++}}
  if(created)save();return created}
function billOccs(from,to){const out=[];for(const b of S.bills)for(const d of occurrences(b,from,to))out.push({b,date:d,paid:!!(b.paid&&b.paid[d])});
  return out.sort((a,c)=>a.date<c.date?-1:a.date>c.date?1:0)}
function occStatus(o){if(o.paid)return'paid';const t=today();return o.date<t?'late':o.date===t?'today':'soon'}
function upcoming(n){const T=today();return billOccs(addDays(T,-60),addDays(T,120)).filter(o=>!o.paid).slice(0,n)}
const goalSaved=g=>(+g.start||0)+g.contribs.reduce((s,c)=>s+c.amount,0);
function monthsLeft(dl){if(!dl)return 0;const d=diffDays(dl,today());return d<=0?1:Math.max(1,Math.ceil(d/30.4))}
function goalNeed(g){const left=Math.max(0,g.target-goalSaved(g));if(left<=0)return 0;if(g.deadline)return left/monthsLeft(g.deadline);return g.monthly||0}
function goalETA(g){const left=g.target-goalSaved(g);if(left<=0)return'done';const m=g.monthly||0;if(m<=0)return null;const mo=Math.ceil(left/m);return addMonthsYM(ym(today()),mo)}
function budgetRows(m){const st=monthStats(m),prev=monthStats(addMonthsYM(m,-1));const rows=[];
  for(const id in S.budget.cats){const b=S.budget.cats[id];if(!(b.limit>0))continue;
    const spent=st.byCat[id]||0,carry=b.roll?Math.max(0,b.limit-(prev.byCat[id]||0)):0,limit=b.limit+carry;
    rows.push({id,cat:cat(id),base:b.limit,roll:b.roll,limit,carry,spent,left:limit-spent,pct:spent/limit})}
  return rows.sort((a,b)=>b.pct-a.pct)}
function budgetTotal(m){const rows=budgetRows(m),st=monthStats(m);const lim=S.budget.total>0?S.budget.total:rows.reduce((s,r)=>s+r.limit,0);
  return{limit:lim,spent:st.expense,left:lim-st.expense,pct:lim>0?st.expense/lim:0}}
function safeToSpend(){const T=today(),m=ym(T),tt=totals(),end=m+'-'+pad(daysIn(m));
  const bills=billOccs(addDays(T,-60),end).filter(o=>!o.paid).reduce((s,o)=>s+toBase(o.b.amount,o.b.currency),0);
  let reserve=0;for(const g of S.goals){const need=goalNeed(g);if(need<=0)continue;
    const paid=g.contribs.filter(c=>ym(c.date)===m).reduce((s,c)=>s+c.amount,0);reserve+=toBase(Math.max(0,need-paid),g.cur)}
  const cc=Math.max(0,-tt.credit);const safe=tt.liquid-bills-reserve-cc;
  const left=Math.max(1,daysIn(m)-(+T.slice(8))+1);
  return{liquid:tt.liquid,bills,reserve,cc,safe,perDay:safe/left,daysLeft:left}}
function debtPayoff(d){const B=d.balance,P=d.minPay,r=(d.rate||0)/1200;if(B<=0)return{months:0};if(P<=0)return{months:null};
  if(r===0)return{months:Math.ceil(B/P)};if(P<=B*r)return{months:null};return{months:Math.ceil(-Math.log(1-B*r/P)/Math.log(1+r))}}
function netWorth(upTo){const bal=accBalances(upTo);let a=0,l=0;
  for(const ac of S.accounts){const v=toBase(bal[ac.id],ac.currency);if(v>=0)a+=v;else l+=-v}
  for(const x of S.assets)a+=toBase(x.value,x.cur);for(const d of S.debts)l+=toBase(d.balance,d.cur);
  return{assets:a,liabilities:l,net:a-l}}

/* ============ Insights (rule-based, each number comes from the calculations above) ============ */
function insights(){const out=[],T=today(),m=ym(T),pm=addMonthsYM(m,-1),day=+T.slice(8);
  const cur=monthStats(m),prev=monthStats(pm,day);
  const cands=Object.keys(cur.byCat).map(id=>({id,c:cur.byCat[id],p:prev.byCat[id]||0})).filter(x=>x.p>0&&x.c>=50000&&(x.c-x.p)/x.p>=.15).sort((a,b)=>(b.c-b.p)-(a.c-a.p));
  cands.slice(0,2).forEach(x=>out.push({tone:'warn',icon:'up',title:`Pengeluaran ${cat(x.id).name} naik ${Math.round((x.c-x.p)/x.p*100)}%`,text:`Sampai tanggal ${day} bulan ini ${fmt(x.c)}, dibanding ${fmt(x.p)} pada periode yang sama bulan lalu.`,basis:'Perbandingan transaksi tanggal 1 sampai hari ini dengan rentang tanggal yang sama bulan lalu.'}));
  const dim=daysIn(m);
  budgetRows(m).forEach(r=>{if(r.spent>r.limit)out.push({tone:'bad',icon:'bell',title:`Anggaran ${r.cat.name} terlampaui`,text:`Terpakai ${fmt(r.spent)} dari batas ${fmt(r.limit)}, lebih ${fmt(r.spent-r.limit)}.`,basis:'Pengeluaran kategori bulan ini dibanding batas anggaran.'});
    else if(r.spent>0&&day>=5){const proj=r.spent/day*dim;if(proj>r.limit*1.02){const hit=Math.min(dim,Math.ceil(r.limit/(r.spent/day)));out.push({tone:'warn',icon:'bell',title:`Anggaran ${r.cat.name} bisa habis sekitar tanggal ${hit}`,text:`Dengan laju belanja saat ini (${fmt(r.spent/day)} per hari) batas ${fmt(r.limit)} terlewati sebelum akhir bulan.`,basis:'Rata-rata harian bulan ini dikalikan jumlah hari dalam bulan.'})}}});
  S.goals.forEach(g=>{const need=goalNeed(g);if(need>0&&g.deadline)out.push({tone:'info',icon:'target',title:`${g.name}: sisihkan ${fmt(need,g.cur)} per bulan`,text:`Sisa target ${fmt(g.target-goalSaved(g),g.cur)} dalam ${monthsLeft(g.deadline)} bulan menuju ${fmtDate(g.deadline)}.`,basis:'Sisa target dibagi jumlah bulan sampai tenggat.'})});
  const late=billOccs(addDays(T,-60),T).filter(o=>!o.paid&&o.date<T);
  late.forEach(o=>out.push({tone:'bad',icon:'calendar',title:`${o.b.name} belum dibayar`,text:`Jatuh tempo ${fmtDate(o.date)}, terlambat ${diffDays(T,o.date)} hari. Nominal ${fmt(o.b.amount,o.b.currency)}.`,basis:'Tagihan yang tanggalnya lewat dan belum ditandai lunas.'}));
  const soon=billOccs(T,addDays(T,7)).filter(o=>!o.paid);
  if(soon.length){const tot=soon.reduce((s,o)=>s+toBase(o.b.amount,o.b.currency),0);out.push({tone:'info',icon:'calendar',title:`${soon.length} tagihan jatuh tempo dalam 7 hari`,text:`Total ${fmt(tot)}: ${soon.slice(0,3).map(o=>o.b.name).join(', ')}${soon.length>3?' dan lainnya':''}.`,basis:'Tagihan belum lunas dengan jatuh tempo hari ini sampai 7 hari ke depan.'})}
  const since=addDays(T,-120);const byT={};S.tx.filter(t=>t.type==='expense'&&t.date>=since&&t.date<m+'-01'&&t.title).forEach(t=>{const k=t.catId+'|'+t.title.toLowerCase();(byT[k]=byT[k]||[]).push(toBase(t.amount,accCur(t.accountId)))});
  S.tx.filter(t=>t.type==='expense'&&ym(t.date)===m&&!t.billId&&t.title).forEach(t=>{const a=(byT[t.catId+'|'+t.title.toLowerCase()]||[]).slice().sort((x,y)=>x-y);if(a.length<3)return;const med=a[Math.floor(a.length/2)],v=toBase(t.amount,accCur(t.accountId));
    if(v>=100000&&v>med*2.5)out.push({tone:'warn',icon:'spark',title:`Transaksi tidak biasa: ${t.title}`,text:`${fmt(v)} pada ${fmtShort(t.date)}, sekitar ${(v/med).toFixed(1)} kali nilai tengah transaksi "${t.title}" sebelumnya (${fmt(med)}).`,basis:'Dibandingkan dengan nilai tengah transaksi berjudul sama dalam 120 hari sebelum bulan ini.'})});
  const lm=monthStats(pm);if(lm.rate!==null){out.push(lm.rate>=.2?{tone:'good',icon:'trend',title:`Savings rate ${MONTHS[+pm.slice(5)-1]}: ${Math.round(lm.rate*100)}%`,text:`Dari pemasukan ${fmt(lm.income)} Anda menyisakan ${fmt(lm.net)}.`,basis:'(Pemasukan − pengeluaran) ÷ pemasukan pada bulan penuh terakhir.'}:{tone:lm.rate<0?'bad':'warn',icon:'trend',title:`Savings rate ${MONTHS[+pm.slice(5)-1]}: ${Math.round(lm.rate*100)}%`,text:`Pemasukan ${fmt(lm.income)}, pengeluaran ${fmt(lm.expense)}. Targetkan minimal 20% jika memungkinkan.`,basis:'(Pemasukan − pengeluaran) ÷ pemasukan pada bulan penuh terakhir.'})}
  const ss=safeToSpend();out.push({tone:ss.safe<0?'bad':'info',icon:'wallet',title:ss.safe<0?'Dana likuid kurang dari kewajiban bulan ini':`Aman dibelanjakan ${fmt(ss.safe)} sampai akhir bulan`,text:ss.safe<0?`Kewajiban ${fmt(ss.bills+ss.reserve+ss.cc)} melebihi saldo likuid ${fmt(ss.liquid)}.`:`Sekitar ${fmt(ss.perDay)} per hari selama ${ss.daysLeft} hari, setelah tagihan, setoran tabungan, dan kartu kredit.`,basis:'Saldo likuid − tagihan belum lunas − setoran tabungan bulan ini − kartu kredit terutang.'});
  return out}

function resizeImage(file,max,type,q){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(new Error('read'));
  fr.onload=()=>{if(/svg/.test(file.type)){res(fr.result);return}const im=new Image();im.onerror=()=>rej(new Error('img'));
    im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
      const x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL(type,q||.8))};im.src=fr.result};
  fr.readAsDataURL(file)})}

function hue(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h}
function initials(n){const w=String(n).trim().split(/\s+/);return(w.length>1?w[0][0]+w[1][0]:String(n).trim().slice(0,2)).toUpperCase()}
function logo(b,cls){const h=b.hue!=null?b.hue:hue(b.name);
  return `<span class="logo ${cls||''}" style="--h:${h}">${b.logo?`<img src="${esc(b.logo)}" alt="">`:esc(initials(b.name))}</span>`}
function catBadge(c){return `<span class="cbadge" style="--c:${c.color}">${icon(c.icon,19)}</span>`}
function delta(cur,prev,invert){if(!prev)return '';const p=(cur-prev)/Math.abs(prev)*100;if(Math.abs(p)<.5)return `<small>sama dengan bulan lalu</small>`;
  const good=invert?p<0:p>0;return `<small class="${good?'pos':'neg'}">${p>0?'▲':'▼'} ${Math.abs(Math.round(p))}% vs bulan lalu</small>`}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function lineChart(labels,series,label){
  const W=480,H=230,L=48,R=16,T=14,B=28;const max=niceMax(Math.max(1,...series.flatMap(s=>s.vals)));
  const x=i=>L+(labels.length===1?0:i*(W-L-R)/(labels.length-1)),y=v=>T+(H-T-B)*(1-Math.max(0,v)/max);let g='';
  for(let i=0;i<=4;i++){const v=max*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" class="gl"/><text x="${L-8}" y="${(y(v)+4).toFixed(1)}" class="ax" text-anchor="end">${compact(v)}</text>`}
  labels.forEach((l,i)=>g+=`<text x="${x(i).toFixed(1)}" y="${H-6}" class="ax" text-anchor="middle">${l}</text>`);
  series.forEach(s=>{const p=s.vals.map((v,i)=>[x(i),y(v)]);let d='M'+p[0][0].toFixed(1)+' '+p[0][1].toFixed(1);
    for(let i=1;i<p.length;i++){const mx=(p[i-1][0]+p[i][0])/2;d+=`C${mx.toFixed(1)} ${p[i-1][1].toFixed(1)} ${mx.toFixed(1)} ${p[i][1].toFixed(1)} ${p[i][0].toFixed(1)} ${p[i][1].toFixed(1)}`}
    if(s.area)g+=`<path d="${d}L${p[p.length-1][0].toFixed(1)} ${y(0)}L${p[0][0].toFixed(1)} ${y(0)}Z" class="${s.cls}-f"/>`;
    g+=`<path d="${d}" class="ln ${s.cls}"/>`;const e=p[p.length-1];g+=`<circle cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="5" class="dot ${s.cls}"/>`});
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(label||'Grafik')}">${g}</svg>`}
function barChart(labels,a,b){const W=480,H=230,L=48,R=10,T=14,B=28,n=labels.length;const max=niceMax(Math.max(1,...a,...b));
  const gw=(W-L-R)/n,bw=Math.min(22,gw*.3),y=v=>T+(H-T-B)*(1-v/max);let g='';
  for(let i=0;i<=4;i++){const v=max*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" class="gl"/><text x="${L-8}" y="${(y(v)+4).toFixed(1)}" class="ax" text-anchor="end">${compact(v)}</text>`}
  labels.forEach((l,i)=>{const cx=L+gw*i+gw/2;g+=`<rect x="${(cx-bw-2).toFixed(1)}" y="${y(a[i]).toFixed(1)}" width="${bw}" height="${(y(0)-y(a[i])).toFixed(1)}" rx="4" class="bi"/><rect x="${(cx+2).toFixed(1)}" y="${y(b[i]).toFixed(1)}" width="${bw}" height="${(y(0)-y(b[i])).toFixed(1)}" rx="4" class="be"/><text x="${cx.toFixed(1)}" y="${H-6}" class="ax" text-anchor="middle">${l}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Pemasukan dan pengeluaran per bulan">${g}</svg>`}
function donut(items,total,center,sub){let off=25,s='';const r=15.9155;
  items.forEach(it=>{const p=total>0?it.val/total*100:0;if(p<=0)return;const l=Math.max(p-.7,.2);s+=`<circle r="${r}" cx="21" cy="21" fill="none" stroke="${it.color}" stroke-width="5.4" stroke-dasharray="${l.toFixed(2)} ${(100-l).toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"/>`;off-=p});
  return `<svg viewBox="0 0 42 42" class="donut" role="img" aria-label="Pengeluaran per kategori"><circle r="${r}" cx="21" cy="21" fill="none" stroke="var(--line)" stroke-width="5.4"/>${s}<text x="21" y="21.4" text-anchor="middle" class="dc1">${esc(center)}</text><text x="21" y="26" text-anchor="middle" class="dc2">${esc(sub)}</text></svg>`}
function emptyState(t,p,btn){return `<div class="empty"><h3>${t}</h3><p>${p}</p>${btn||''}</div>`}
function monthWindow(m,n){const a=[];for(let i=n-1;i>=0;i--)a.push(addMonthsYM(m,-i));return a}
function upItem(o){const b=o.b,st=occStatus(o),d=diffDays(o.date,today());
  const lab=st==='paid'?'Lunas':st==='late'?`Terlambat ${-d} hari`:st==='today'?'Hari ini':d===1?'Besok':`${d} hari lagi`;

function insightHTML(i,withBasis){return `<div class="insight ${i.tone}"><span class="ib">${icon(i.icon,18)}</span><div><b>${esc(i.title)}</b><p class="muted">${esc(i.text)}</p>${withBasis?`<small>Dasar hitungan: ${esc(i.basis)}</small>`:''}</div></div>`}

function filteredTx(){const f=ui.f;const q=f.q.trim().toLowerCase();
  return S.tx.filter(t=>{if(!f.all&&ym(t.date)!==ui.month)return false;if(f.type!=='all'&&t.type!==f.type)return false;
    if(f.acc!=='all'&&t.accountId!==f.acc&&t.toAccountId!==f.acc)return false;
    if(f.cat!=='all'&&!(t.type!=='transfer'&&parts(t).some(p=>p.catId===f.cat)))return false;
    if(q){const hay=((t.title||'')+' '+(t.note||'')+' '+cat(t.catId).name+' '+(acc(t.accountId)||{name:''}).name).toLowerCase();if(!hay.includes(q))return false}return true})
    .sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1))}
function txListHTML(){const rows=filteredTx();if(!rows.length)return emptyState('Tidak ada transaksi','Ubah filter atau catat transaksi baru.');
  const shown=rows.slice(0,ui.f.limit);let h='<div class="list">',last='';
  for(const t of shown){if(t.date!==last){last=t.date;const net=rows.filter(x=>x.date===t.date&&x.type!=='transfer').reduce((s,x)=>s+(x.type==='income'?1:-1)*toBase(x.amount,accCur(x.accountId)),0);
    h+=`<div class="dh"><span>${dateLabel(t.date)}</span><span class="num">${net>=0?'+':'−'}${fmt(Math.abs(net))}</span></div>`}h+=txRow(t)}
  h+='</div>';if(rows.length>shown.length)h+=`<div style="text-align:center;margin-top:12px"><button class="btn" data-a="moretx">Muat lebih banyak (${rows.length-shown.length})</button></div>`;return h}
function txSummaryHTML(){const rows=filteredTx();let inc=0,exp=0;rows.forEach(t=>{const v=toBase(t.amount,accCur(t.accountId));if(t.type==='income')inc+=v;else if(t.type==='expense')exp+=v});
  return `<div class="stats" style="margin-bottom:14px"><div class="stat"><small>Transaksi</small><b class="num">${rows.length}</b></div><div class="stat"><small>Pemasukan</small><b class="num pos">${fmt(inc)}</b></div><div class="stat"><small>Pengeluaran</small><b class="num neg">${fmt(exp)}</b></div><div class="stat"><small>Selisih</small><b class="num ${inc-exp>=0?'pos':'neg'}">${fmt(inc-exp)}</b></div></div>`}

views.budget=function(){const m=ui.month,bt=budgetTotal(m),rows=budgetRows(m),T=today(),isNow=m===ym(T),dim=daysIn(m),day=isNow?+T.slice(8):(m<ym(T)?dim:0);

    <div class="card c7"><div class="ch"><h3>Anggaran vs aktual per kategori</h3></div>${rows.length?rows.map(r=>`<div class="brow"><div class="h"><span class="row">${catBadge(r.cat)}<span><b>${esc(r.cat.name)}</b><br><small>${r.roll?'Rollover aktif'+(r.carry>0?` · bawa ${fmt(r.carry)}`:''):'Tanpa rollover'}</small></span></span><span style="text-align:right"><b class="num">${fmt(r.spent)}</b><br><small class="num">dari ${fmt(r.limit)}</small></span></div><div class="bar"><i class="${th(r.pct)}" style="width:${clamp(r.pct*100,0,100)}%"></i>${isNow?`<span class="mk" style="left:${day/dim*100}%"></span>`:''}</div><div class="row"><small class="${r.left<0?'neg':''} num">${r.left>=0?'Sisa '+fmt(r.left):'Lebih '+fmt(-r.left)}</small><span class="sp"></span>${chip(r)}</div></div>`).join(''):emptyState('Belum ada batas kategori','Atur batas untuk kategori yang ingin dikontrol.')}</div>

function suggestHTML(m){const ms=[1,2,3].map(k=>monthStats(addMonthsYM(m,-k)));const ids=new Set();ms.forEach(s=>Object.keys(s.byCat).forEach(i=>ids.add(i)));
  const rows=[...ids].filter(i=>i!=='fees').map(i=>({id:i,avg:ms.reduce((s,x)=>s+(x.byCat[i]||0),0)/3,cur:S.budget.cats[i]?S.budget.cats[i].limit:0})).filter(r=>r.avg>0).sort((a,b)=>b.avg-a.avg).slice(0,8);
  if(!rows.length)return `<p class="muted">Saran muncul setelah ada riwayat pengeluaran.</p>`;
  const step=S.settings.base==='IDR'?50000:10;
  return `<div class="scroll-x"><table class="tbl"><thead><tr><th>Kategori</th><th class="r">Rata-rata</th><th class="r">Batas saat ini</th><th class="r">Saran</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(cat(r.id).name)}</td><td class="r num">${fmt(r.avg)}</td><td class="r num">${r.cur?fmt(r.cur):'–'}</td><td class="r num"><b>${fmt(Math.ceil(r.avg/step)*step)}</b></td></tr>`).join('')}</tbody></table></div>`}

views.goals=function(){const tot=S.goals.reduce((s,g)=>s+toBase(goalSaved(g),g.cur),0),tg=S.goals.reduce((s,g)=>s+toBase(g.target,g.cur),0);

function billSummary(m){const occ=billOccs(m+'-01',m+'-'+pad(daysIn(m)));let tot=0,paid=0,late=0;occ.forEach(o=>{const v=toBase(o.b.amount,o.b.currency);tot+=v;if(o.paid)paid+=v;else if(o.date<today())late++});return{occ,tot,paid,rest:tot-paid,late}}
views.bills=function(){const cm=ui.calMonth,sm=billSummary(cm);

  const dayEv=(ev[sel]||{b:[],inc:0,goal:0});const incs=S.recurring.filter(r=>r.tpl.type==='income'&&occurrences({start:r.next,freq:r.freq,end:r.end},sel,sel).length);

    +incs.map(r=>`<div class="day-ev"><span class="cbadge" style="--c:var(--pos)">${icon('down',19)}</span><div class="sp"><b>${esc(r.tpl.title)}</b><br><small>Pemasukan berulang</small></div><b class="num pos">+${fmt(r.tpl.amount,accCur(r.tpl.accountId))}</b></div>`).join('')

    :`<p class="muted">Tidak ada tagihan atau jadwal pada tanggal ini.</p>`}</div>`;
  const ups=upcoming(6);
  return head+`<div class="stats" style="margin-bottom:16px"><div class="stat"><small>Komitmen ${MONTHS[mo-1]}</small><b class="num">${fmt(sm.tot)}</b></div><div class="stat"><small>Sudah dibayar</small><b class="num pos">${fmt(sm.paid)}</b></div><div class="stat"><small>Belum dibayar</small><b class="num ${sm.late?'neg':''}">${fmt(sm.rest)}</b></div><div class="stat"><small>Terlambat</small><b class="num ${sm.late?'neg':''}">${sm.late} tagihan</b></div></div>

/* ============ Modal infrastructure ============ */
let modal=null;

const opt=(v,l,sel)=>`<option value="${esc(v)}" ${String(sel)===String(v)?'selected':''}>${esc(l)}</option>`;
const accOpts=(sel,none)=>(none?opt('','Tidak dari akun',sel):'')+S.accounts.map(a=>opt(a.id,`${a.name} (${a.currency})`,sel)).join('');
const FOOT=(extra,label)=>`<div class="foot">${extra||''}<span class="sp"></span><button type="button" class="btn" data-a="close">Batal</button><button type="submit" class="btn pri">${label||'Simpan'}</button></div>`;
const swatches=(name,sel)=>`<div class="sw">${COLORS.map(c=>`<label><input type="radio" name="${name}" value="${c}" ${sel===c?'checked':''}><span style="--c:${c}">${icon('check',16)}</span></label>`).join('')}</div>`;
const money=(name,val,cur,extra)=>`<input class="inp ${extra||''}" name="${name}" data-money data-cur="${cur}" inputmode="decimal" autocomplete="off" value="${esc(val)}" placeholder="0">`;
const delBtn=(a,id)=>`<button type="button" class="btn dng" data-a="${a}" data-id="${id}">${icon('trash',16)}Hapus</button>`;
function openModal(o){modal=o;renderModal()}
function closeModal(){modal=null;const m=$('#modal');if(m)m.innerHTML=''}
function renderModal(){if(!modal)return;const old=document.querySelector('.sheet'),sc=old?old.scrollTop:0;
  $('#modal').innerHTML=`<div class="overlay"><div class="sheet ${modal.wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(modal.title)}"><div class="sh-h"><h2>${esc(modal.title)}</h2><button class="icon-btn" type="button" data-a="close" aria-label="Tutup">${icon('x')}</button></div><form id="mform" class="sh-b" novalidate>${modal.body}</form></div></div>`;
  const n=document.querySelector('.sheet');if(n&&sc)n.scrollTop=sc}
function rebuild(){if(modal&&modal.build){modal.body=modal.build(modal.draft);renderModal()}}
function syncDraft(form,d){if(!form)return;for(const el of form.elements){if(!el.name||el.type==='file')continue;
  if(el.type==='checkbox')d[el.name]=el.checked;else if(el.type==='radio'){if(el.checked)d[el.name]=el.value}else d[el.name]=el.value}}
function confirmModal(title,text,label,fn){openModal({title,body:`<p style="margin-bottom:6px">${text}</p><div class="foot"><span class="sp"></span><button type="button" class="btn" data-a="close">Batal</button><button type="submit" class="btn dng arm">${label}</button></div>`,onSubmit:()=>{closeModal();fn()}})}
const arm=el=>{if(el.dataset.armed){return true}el.dataset.armed='1';el.classList.add('arm');el.innerHTML='Yakin hapus?';setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.classList.remove('arm');el.innerHTML=`${icon('trash',16)}Hapus`}},3500);return false};
function done(msg){save();closeModal();render();if(msg)toast(msg)}

/* ============ Transaction form ============ */
function lastAcc(){const t=S.tx.slice().sort((a,b)=>a.date<b.date?1:-1).find(x=>acc(x.accountId));return t?t.accountId:(S.accounts[0]||{}).id}
function newDraft(type,o){return Object.assign({type:type||'expense',amount:'',accountId:lastAcc()||'',toAccountId:'',toAmount:'',fee:'',catId:'',date:today(),title:'',note:'',splitOn:false,splits:[],receipt:'',repeat:'none',keep:{}},o)}
function openTx(d){if(!S.accounts.length){toast('Tambahkan akun dulu');openAcc();return}
  if(d.type==='transfer'&&!d.toAccountId&&!d.goalId){const o=S.accounts.find(a=>a.id!==d.accountId);d.toAccountId=o?o.id:''}
  openModal({title:d.id?'Ubah transaksi':'Catat transaksi',draft:d,build:txBody,body:txBody(d),onSubmit:saveTx})}
function txBody(d){const T=d.type,isT=T==='transfer',goalT=isT&&d.keep&&d.keep.goalId,a=acc(d.accountId),to=acc(d.toAccountId),cur=a?a.currency:S.settings.base;
  const cross=isT&&!goalT&&a&&to&&a.currency!==to.currency;const cats=S.cats.filter(c=>c.type===(T==='income'?'income':'expense')&&!c.system);
  if(!isT&&!cats.some(c=>c.id===d.catId))d.catId=cats[0]?cats[0].id:'';
  const cv=cur==='IDR'?[10000,20000,50000,100000]:cur==='JPY'?[500,1000,5000,10000]:[5,10,50,100];
  const rec=[...new Set(S.tx.filter(t=>t.type===T&&t.title).sort((x,y)=>x.date<y.date?1:-1).slice(0,60).map(t=>t.title))].slice(0,12);
  let h=goalT?'':`<div class="seg">${[['expense','Pengeluaran'],['income','Pemasukan'],['transfer','Transfer']].map(k=>`<button type="button" class="${T===k[0]?'on':''}" data-a="txtype" data-t="${k[0]}">${k[1]}</button>`).join('')}</div>`;
  h+=F(isT?`Nominal dikirim (${cur})`:`Nominal (${cur})`,money('amount',d.amount,cur,'big'));
  h+=`<div class="chips">${cv.map(v=>`<button type="button" class="chip" data-a="addamt" data-v="${v}">+${compact(v)}</button>`).join('')}</div>`;
  if(isT){h+=`<div class="two">${F('Dari akun',`<select class="inp" name="accountId" data-rr="1">${accOpts(d.accountId)}</select>`)}${goalT?F('Tujuan',`<input class="inp" value="${esc((S.goals.find(g=>g.id===d.keep.goalId)||{}).name||'Tabungan')}" disabled>`):F('Ke akun',`<select class="inp" name="toAccountId" data-rr="1">${accOpts(d.toAccountId)}</select>`)}</div>`;
    if(cross){const sug=conv(parseAmt(d.amount),a.currency,to.currency);h+=F(`Nominal diterima (${to.currency})`,money('toAmount',d.toAmount,to.currency),sug!==null&&parseAmt(d.amount)>0?`Dengan kurs tersimpan ± ${fmt(sug,to.currency)}. <button type="button" class="chip" data-a="userate">Pakai kurs tersimpan</button>`:`Kurs ${to.currency} belum diisi, jadi isi nominal yang diterima.`)}
    h+=F(`Biaya admin (${cur}), opsional`,money('fee',d.fee,cur));
    h+=`<p class="hint">Transfer antar akun bukan pemasukan atau pengeluaran, jadi tidak mengubah laporan arus kas. Biaya admin dicatat sebagai pengeluaran.</p>`}
  else{h+=`<div class="two">${F('Akun',`<select class="inp" name="accountId" data-rr="1">${accOpts(d.accountId)}</select>`)}${d.splitOn?'<div></div>':F('Kategori',`<select class="inp" name="catId">${cats.map(c=>opt(c.id,c.name,d.catId)).join('')}</select>`)}</div>`;
    if(T==='expense'){h+=`<label class="ckrow" style="margin-bottom:12px"><input type="checkbox" name="splitOn" data-rr="1" ${d.splitOn?'checked':''}>Pisah ke beberapa kategori</label>`;
      if(d.splitOn){if(!d.splits.length)d.splits=[{catId:cats[0].id,amount:''},{catId:(cats[1]||cats[0]).id,amount:''}];
        h+=d.splits.map((s,i)=>`<div class="split"><select class="inp" name="sc_${i}">${cats.map(c=>opt(c.id,c.name,s.catId)).join('')}</select>${money('sa_'+i,s.amount,cur)}<button type="button" class="icon-btn" data-a="rmsplit" data-i="${i}" aria-label="Hapus baris">${icon('x',18)}</button></div>`).join('')+`<button type="button" class="btn sm" data-a="addsplit" style="margin-bottom:14px">${icon('plus',16)}Tambah baris</button>`}}}
  h+=F('Judul',`<input class="inp" name="title" list="dl_titles" value="${esc(d.title)}" placeholder="${isT?'Mis. Top up GoPay':T==='income'?'Mis. Gaji Oktober':'Mis. Makan siang'}" autocomplete="off"><datalist id="dl_titles">${rec.map(r=>`<option value="${esc(r)}">`).join('')}</datalist>`);
  h+=F('Tanggal',`<input class="inp" type="date" name="date" value="${esc(d.date)}">`);
  h+=F('Catatan, opsional',`<textarea class="inp" name="note" rows="2">${esc(d.note)}</textarea>`);
  if(!isT)h+=`<div class="lbl" style="margin-bottom:6px">Lampiran struk</div><div class="rcp">${d.receipt?`<img src="${esc(d.receipt)}" alt="Struk"><button type="button" class="btn sm" data-a="rmreceipt">Hapus lampiran</button>`:`<span class="filefld"><input type="file" name="receiptfile" accept="image/*" aria-label="Unggah foto struk"></span>`}</div>`;
  if(!d.id&&!goalT)h+=F('Ulangi',`<select class="inp" name="repeat"><option value="none">Tidak berulang</option><option value="weekly" ${d.repeat==='weekly'?'selected':''}>Setiap minggu</option><option value="monthly" ${d.repeat==='monthly'?'selected':''}>Setiap bulan</option><option value="yearly" ${d.repeat==='yearly'?'selected':''}>Setiap tahun</option></select>`);
  return h+FOOT(d.id?delBtn('deltx',d.id):'')}
function syncSplits(form,d){if(!d.splitOn){d.splits=[];return}const out=[];let i=0;while(form.elements['sc_'+i]){out.push({catId:form.elements['sc_'+i].value,amount:form.elements['sa_'+i].value});i++}d.splits=out}
function saveTx(form){const d=modal.draft;syncDraft(form,d);syncSplits(form,d);const a=acc(d.accountId);if(!a)return toast('Pilih akun');
  const amt=parseAmt(d.amount);if(!(amt>0))return toast('Isi nominal lebih dari nol');
  const t={id:d.id||uid(),type:d.type,date:d.date||today(),amount:amt,accountId:a.id,title:(d.title||'').trim(),note:(d.note||'').trim(),fee:0};
  if(d.type==='transfer'){t.fee=parseAmt(d.fee)||0;
    if(d.keep&&d.keep.goalId){}else{const to=acc(d.toAccountId);if(!to)return toast('Pilih akun tujuan');if(to.id===a.id)return toast('Akun asal dan tujuan harus berbeda');t.toAccountId=to.id;
      if(to.currency!==a.currency){let ta=parseAmt(d.toAmount);if(!(ta>0)){const c=conv(amt,a.currency,to.currency);if(c===null)return toast('Kurs tidak tersedia, isi nominal diterima');ta=Math.round(c*100)/100}t.toAmount=ta}}}
  else{if(d.splitOn&&d.splits.length){const sp=d.splits.map(s=>({catId:s.catId,amount:parseAmt(s.amount)})).filter(s=>s.amount>0);const sum=sp.reduce((x,s)=>x+s.amount,0);
      if(!sp.length||Math.abs(sum-amt)>0.005)return toast(`Total pisahan ${fmt(sum,a.currency)} harus sama dengan nominal ${fmt(amt,a.currency)}`);t.splits=sp;t.catId=sp[0].catId}
    else t.catId=d.catId||(d.type==='income'?'otherinc':'other');if(d.receipt)t.receipt=d.receipt}
  Object.assign(t,d.keep||{});
  const i=S.tx.findIndex(x=>x.id===t.id);if(i>=0)S.tx[i]=t;else{S.tx.push(t);
    if(d.repeat&&d.repeat!=='none'){const anchor=+t.date.slice(8);S.recurring.push({id:uid(),tpl:{type:t.type,amount:t.amount,accountId:t.accountId,toAccountId:t.toAccountId||'',toAmount:t.toAmount,fee:t.fee,catId:t.catId||'',title:t.title,note:t.note},freq:d.repeat,anchor,next:advance(t.date,d.repeat,anchor),end:''})}}
  done(i>=0?'Transaksi diperbarui':'Transaksi disimpan')}

  openModal({title:c?'Ubah kategori':'Kategori baru',body:F('Nama',`<input class="inp" name="name" value="${esc(d.name)}" autocomplete="off">`)+(c?'':F('Jenis',`<select class="inp" name="type"><option value="expense">Pengeluaran</option><option value="income">Pemasukan</option></select>`))+
    `<div class="lbl" style="margin-bottom:8px">Ikon</div><div class="sw" style="margin-bottom:14px">${CICONS.map(i=>`<label><input type="radio" name="icon" value="${i}" ${d.icon===i?'checked':''}><span style="--c:var(--accent-strong)">${icon(i,16)}</span></label>`).join('')}</div><div class="lbl" style="margin-bottom:8px">Warna</div>${swatches('color',d.color)}<div style="height:14px"></div>`+FOOT(c?delBtn('delcat',c.id):''),
    onSubmit:f=>{const e=f.elements;if(!e.name.value.trim())return toast('Isi nama kategori');const o={name:e.name.value.trim(),icon:(f.querySelector('[name=icon]:checked')||{value:'dots'}).value,color:(f.querySelector('[name=color]:checked')||{value:COLORS[0]}).value};
      if(c)Object.assign(c,o);else S.cats.push(Object.assign({id:'c_'+uid(),type:e.type.value},o));done('Kategori disimpan')}})}
function recurModal(){openModal({title:'Transaksi berulang',body:S.recurring.length?`<div class="list">${S.recurring.map(r=>{const c=cat(r.tpl.catId);return `<div class="li">${r.tpl.type==='transfer'?`<span class="cbadge neu">${icon('swap',19)}</span>`:catBadge(c)}<span class="t"><b>${esc(r.tpl.title||c.name)}</b><small>${FREQ[r.freq]} · berikutnya ${fmtDate(r.next)}</small></span><span class="r"><b class="num ${r.tpl.type==='income'?'pos':''}">${fmt(r.tpl.amount,accCur(r.tpl.accountId))}</b></span><button type="button" class="icon-btn" data-a="delrec" data-id="${r.id}" aria-label="Hentikan">${icon('trash',18)}</button></div>`}).join('')}</div><p class="hint" style="margin-top:12px">Transaksi dibuat otomatis saat tanggalnya tiba dan aplikasi dibuka. Untuk membuat yang baru, pilih Ulangi saat mencatat transaksi.</p>`:`<p class="muted">Belum ada transaksi berulang. Pilih Ulangi saat mencatat transaksi, misalnya gaji bulanan.</p>`,plain:true})}

/* ============ CSV, backup ============ */
const csvq=v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function csvText(){const rows=[['tanggal','jenis','akun','akun_tujuan','kategori','judul','nominal','mata_uang','catatan']];
  S.tx.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(t=>{const a=acc(t.accountId),to=acc(t.toAccountId);rows.push([t.date,t.type,a?a.name:'',to?to.name:'',t.type==='transfer'?'':cat(t.catId).name,t.title,t.amount,a?a.currency:'',t.note])});return rows.map(r=>r.map(csvq).join(',')).join('\n')}
function csvParse(txt){const rows=[];let r=[],f='',q=false;for(let i=0;i<txt.length;i++){const c=txt[i];
  if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','||c===';'){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;r.push(f);f='';if(r.some(x=>x!==''))rows.push(r);r=[]}else f+=c}
  r.push(f);if(r.some(x=>x!==''))rows.push(r);return rows}
function exportCsv(){openModal({title:'Ekspor CSV',wide:true,body:`<p class="hint" style="margin-top:0">Unduhan file tidak tersedia di halaman ini. Salin teks berikut lalu tempel ke Excel, Google Sheets, atau simpan sebagai file .csv.</p><textarea class="inp code" id="csvout" readonly>${esc(csvText())}</textarea><div class="foot"><span class="sp"></span><button type="button" class="btn" data-a="close">Tutup</button><button type="button" class="btn pri" data-a="copyfrom" data-t="csvout">${icon('copy',16)}Salin</button></div>`,plain:true})}
function importCsv(){openModal({title:'Impor CSV',wide:true,body:`<p class="hint" style="margin-top:0">Tempel isi CSV dengan kolom: tanggal (YYYY-MM-DD atau DD/MM/YYYY), jenis (pemasukan/pengeluaran), akun, kategori, judul, nominal, catatan. Nama akun harus sama dengan akun yang sudah ada.</p><textarea class="inp code" name="csv" placeholder="tanggal,jenis,akun,kategori,judul,nominal,catatan"></textarea>`+FOOT('','Impor'),
  onSubmit:f=>{const rows=csvParse(f.elements.csv.value);if(rows.length<2)return toast('Tempel minimal satu baris data beserta judul kolom');
    const h=rows[0].map(x=>x.trim().toLowerCase()),ix=(...n)=>h.findIndex(x=>n.includes(x));const c={d:ix('tanggal','date'),t:ix('jenis','type'),a:ix('akun','account'),to:ix('akun_tujuan'),c:ix('kategori','category'),ti:ix('judul','title'),n:ix('nominal','amount'),no:ix('catatan','note')};
    if(c.d<0||c.n<0)return toast('Kolom tanggal dan nominal wajib ada');let ok=0,skip=0;
    for(const r of rows.slice(1)){let d=(r[c.d]||'').trim();const m=d.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);if(m)d=`${m[3]}-${pad(+m[2])}-${pad(+m[1])}`;
      const amt=parseAmt((r[c.n]||'').replace(/[^\d.,-]/g,''));const tp=((c.t>=0?r[c.t]:'')||'').toLowerCase();const type=/masuk|income/.test(tp)?'income':/transfer/.test(tp)?'transfer':'expense';
      const nm=(r[c.a]||'').trim().toLowerCase();const a=S.accounts.find(x=>x.name.toLowerCase()===nm)||(S.accounts.length===1?S.accounts[0]:null);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!(amt>0)||!a){skip++;continue}
      const t={id:uid(),type,date:d,amount:Math.abs(amt),accountId:a.id,title:(r[c.ti]||'').trim(),note:(r[c.no]||'').trim(),fee:0};
      if(type==='transfer'){const to=S.accounts.find(x=>x.name.toLowerCase()===(r[c.to]||'').trim().toLowerCase());if(!to||to.id===a.id){skip++;continue}t.toAccountId=to.id;if(to.currency!==a.currency){const cv=conv(t.amount,a.currency,to.currency);if(cv===null){skip++;continue}t.toAmount=Math.round(cv*100)/100}}
      else{const cn=(r[c.c]||'').trim().toLowerCase();const cc=S.cats.find(x=>x.name.toLowerCase()===cn&&x.type===(type==='income'?'income':'expense'));t.catId=cc?cc.id:(type==='income'?'otherinc':'other')}
      S.tx.push(t);ok++}
    done(`${ok} transaksi diimpor${skip?`, ${skip} dilewati`:''}`)}})}
function backupModal(){openModal({title:'Cadangan data',wide:true,body:`<p class="hint" style="margin-top:0">Salin teks ini dan simpan di tempat aman (catatan, email ke diri sendiri). Untuk memulihkan, gunakan Pulihkan dari cadangan.</p><textarea class="inp code" id="bkout" readonly>${esc(JSON.stringify(S))}</textarea><div class="foot"><span class="sp"></span><button type="button" class="btn" data-a="close">Tutup</button><button type="button" class="btn pri" data-a="copyfrom" data-t="bkout">${icon('copy',16)}Salin</button></div>`,plain:true})}
function restoreModal(){openModal({title:'Pulihkan dari cadangan',wide:true,body:`<p class="hint" style="margin-top:0">Tempel teks JSON hasil Salin cadangan. Data saat ini akan diganti.</p><textarea class="inp code" name="json" placeholder='{"v":1,...}'></textarea>`+FOOT('','Ganti data saya'),
  onSubmit:f=>{try{const o=JSON.parse(f.elements.json.value);if(!o||o.v!==1||!Array.isArray(o.accounts)||!Array.isArray(o.tx))throw 0;const b=blankData();S=Object.assign(b,o);S.settings=Object.assign(b.settings,o.settings);ensureShape();done('Data dipulihkan')}catch(e){toast('Teks cadangan tidak valid')}}})}

/* ============ Onboarding ============
   Finora has no real authentication: data lives in this browser's localStorage, so onboarding state is stored
   per browser profile inside the same saved object (S.settings.onboarding). It is NOT tied to a user account. */
const OB_STEPS=['welcome','profile','currency','start','account','goal','review'];
const OB_ACC_TYPES={bank:'Rekening bank',ewallet:'E-wallet',cash:'Tunai',savings:'Rekening tabungan',credit:'Kartu kredit'};
const OB_MODES={zero:['Mulai dari nol','Saya akan mencatat transaksi nanti.'],balances:['Masukkan saldo rekening saya','Isi saldo awal akun yang sudah ada.'],explore:['Jelajahi Finora dulu','Memuat data contoh untuk dicoba. Bisa dihapus kapan saja.']};
let onbErr='',onbLast='',onbGuardUntil=0;
const onbActive=()=>{const o=S.settings.onboarding;return !!(o&&o.status==='inprogress')};
function onbDraft(){const o=S.settings.onboarding,d=o.draft||{};
  o.draft=Object.assign({name:S.settings.name||'',base:S.settings.base||'IDR',mode:'zero',limit:''},d);
  o.draft.acc=Object.assign({name:'',type:'bank',currency:'',opening:''},d.acc);
  o.draft.goal=Object.assign({name:'',target:'',start:'',deadline:''},d.goal);return o.draft}
function onbSteps(){const d=onbDraft();return OB_STEPS.filter(s=>!(d.mode==='explore'&&(s==='account'||s==='goal')))}
function onbSync(){const f=document.getElementById('onbform');if(!f||!onbActive())return;const d=onbDraft(),g=n=>{const x=f.elements.namedItem(n);return x?x.value:null};let v;
  if((v=g('p_name'))!==null)d.name=v;
  if((v=g('c_base'))&&CURS[v])d.base=v;
  if((v=g('s_mode'))&&OB_MODES[v])d.mode=v;
  if((v=g('s_limit'))!==null)d.limit=v;
  ['name','type','currency','opening'].forEach(k=>{if((v=g('a_'+k))!==null)d.acc[k]=v});
  ['name','target','start','deadline'].forEach(k=>{if((v=g('g_'+k))!==null)d.goal[k]=v});
  save()}

 case 'account':{const ex=o.accId&&acc(o.accId);const cur=d.acc.currency||d.base;
  return `<h1 tabindex="-1">${d.mode==='balances'?'Tambahkan rekening dan saldo awal':'Tambah akun pertama'}</h1><p class="lead">Opsional. Anda bisa menambah akun lain kapan saja.</p>${ex?`<p class="banner info" style="margin-bottom:14px">Akun <b>${esc(ex.name)}</b> sudah dibuat. Mengubah isian akan memperbarui akun yang sama.</p>`:''}
  <label class="fld"><span>Nama akun</span><input class="inp" name="a_name" value="${esc(d.acc.name)}" maxlength="40" autocomplete="off" placeholder="Mis. Bank BCA, GoPay, Dompet"></label>
  <div class="two"><label class="fld"><span>Jenis</span><select class="inp" name="a_type">${Object.keys(OB_ACC_TYPES).map(k=>opt(k,OB_ACC_TYPES[k],d.acc.type)).join('')}</select></label><label class="fld"><span>Mata uang</span><select class="inp" name="a_currency">${Object.keys(CURS).map(c=>opt(c,c,cur)).join('')}</select></label></div>
  <label class="fld"><span>Saldo awal</span>${money('a_opening',d.acc.opening,'@a_currency','big')}</label><p class="hint" style="margin-top:0">Disimpan sebagai saldo awal akun, bukan sebagai transaksi.</p>`}
 case 'goal':{const ex=o.goalId&&S.goals.find(g=>g.id===o.goalId);
  return `<h1 tabindex="-1">Punya tujuan keuangan?</h1><p class="lead">Opsional. Tujuan yang Anda buat muncul di halaman Tabungan.</p>${ex?`<p class="banner info" style="margin-bottom:14px">Tujuan <b>${esc(ex.name)}</b> sudah dibuat. Mengubah isian akan memperbarui tujuan yang sama.</p>`:''}
  <div class="chips">${['Dana darurat','Beli barang besar','Liburan','Tabungan'].map(n=>`<button type="button" class="chip" data-a="onbchip" data-n="${n}">${n}</button>`).join('')}</div>
  <label class="fld"><span>Nama tujuan</span><input class="inp" name="g_name" value="${esc(d.goal.name)}" maxlength="40" autocomplete="off" placeholder="Mis. Dana darurat"></label>
  <div class="two"><label class="fld"><span>Target (${esc(d.base)})</span>${money('g_target',d.goal.target,d.base)}</label><label class="fld"><span>Sudah terkumpul</span>${money('g_start',d.goal.start,d.base)}</label></div>
  <label class="fld"><span>Tenggat, opsional</span><input class="inp" type="date" name="g_deadline" value="${esc(d.goal.deadline)}"></label>`}
 case 'review':{const ac=o.accId&&acc(o.accId),gl=o.goalId&&S.goals.find(g=>g.id===o.goalId);
  return `<h1 tabindex="-1">Semua siap</h1><p class="lead">Periksa ringkasan, lalu buka dashboard Anda.</p><div class="rev">
  <div><span>Nama</span><b>${esc(d.name.trim())||'Belum diisi'}</b></div><div><span>Mata uang utama</span><b>${esc(d.base)}</b></div><div><span>Titik awal</span><b>${OB_MODES[d.mode][0]}</b></div>
  ${d.mode==='explore'?'<div><span>Data contoh</span><b>Akan dimuat</b></div>':`<div><span>Batas pengeluaran</span><b>${parseAmt(d.limit)>0?fmt(parseAmt(d.limit),d.base):'Belum diatur'}</b></div><div><span>Akun</span><b>${ac?esc(ac.name)+' · '+fmt(ac.opening,ac.currency):'Belum ada'}</b></div><div><span>Tujuan</span><b>${gl?esc(gl.name)+' · '+fmt(gl.target,gl.cur):'Belum ada'}</b></div>`}</div>`}
}}
function renderOnb(){const o=S.settings.onboarding,d=onbDraft(),steps=onbSteps();if(!steps.includes(o.step))o.step=steps[0];const i=steps.indexOf(o.step);
  const dark=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);
  const optional=o.step==='account'||o.step==='goal';
  const foot=o.step==='welcome'?`<button type="button" class="btn ghost" data-a="onblater">Nanti saja</button><span class="sp"></span><button type="submit" class="btn pri">Mulai</button>`
   :`${i>0?`<button type="button" class="btn" data-a="onbback">Kembali</button>`:''}<span class="sp"></span>${optional?`<button type="button" class="btn ghost" data-a="onbskip">Lewati</button>`:''}<button type="submit" class="btn pri">${o.step==='review'?'Selesai, buka dashboard':'Lanjut'}</button>`;
  $('#onb').innerHTML=`<div class="onb-wrap"><div class="onb-top"><span class="dbrand"><i aria-hidden="true">F</i>Finora</span><span class="sp" style="flex:1"></span>${o.step==='welcome'?'':`<button type="button" class="btn ghost sm" data-a="onblater" aria-label="Simpan kemajuan dan keluar">Keluar</button>`}<button class="icon-btn bd" type="button" data-a="theme" aria-label="Ganti tema terang atau gelap">${icon(dark?'sun':'moon',19)}</button></div>
   <div class="onb-prog" role="progressbar" aria-valuemin="1" aria-valuemax="${steps.length}" aria-valuenow="${i+1}" aria-label="Kemajuan penyiapan">${steps.map((s,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div><div class="onb-lbl">Langkah ${i+1} dari ${steps.length}</div>
   <form id="onbform" class="onb-card" novalidate>${onbBody(o,d)}${onbErr?`<div class="onb-err" role="alert">${esc(onbErr)}</div>`:''}<div class="onb-foot">${foot}</div></form></div>`;
  if(onbLast!==o.step||onbErr){const h=document.querySelector('#onbform h1');if(h&&onbLast!==o.step)h.focus({preventScroll:true});onbLast=o.step}}
function onbSaveAcc(){const o=S.settings.onboarding,d=onbDraft(),a=d.acc;
  if(!a.name.trim()&&!String(a.opening).trim())return true;
  const nm=a.name.trim();if(!nm){onbErr='Isi nama akun, atau pilih Lewati.';return false}
  if(S.accounts.some(x=>x.id!==o.accId&&x.name.trim().toLowerCase()===nm.toLowerCase())){onbErr='Sudah ada akun bernama "'+nm+'". Gunakan nama lain.';return false}
  const cur=CURS[a.currency]?a.currency:d.base,type=OB_ACC_TYPES[a.type]?a.type:'bank',ex=o.accId&&acc(o.accId);
  if(ex){ex.name=nm;ex.type=type;ex.opening=parseAmt(a.opening);if(!S.tx.some(t=>t.accountId===ex.id||t.toAccountId===ex.id))ex.currency=cur}
  else{const n={id:uid(),name:nm,type,currency:cur,opening:parseAmt(a.opening),color:COLORS[S.accounts.length%COLORS.length]};S.accounts.push(n);o.accId=n.id}
  return true}
function onbSaveGoal(){const o=S.settings.onboarding,d=onbDraft(),g=d.goal;
  if(!g.name.trim()&&!String(g.target).trim()&&!String(g.start).trim()&&!g.deadline)return true;
  if(!g.name.trim()){onbErr='Isi nama tujuan, atau pilih Lewati.';return false}
  const tg=parseAmt(g.target);if(!(tg>0)){onbErr='Isi target nominal yang lebih dari 0.';return false}
  const rec={name:g.name.trim(),cur:d.base,target:tg,start:parseAmt(g.start),deadline:g.deadline||''},ex=o.goalId&&S.goals.find(x=>x.id===o.goalId);
  if(ex){if(!ex.contribs.length)Object.assign(ex,rec);else Object.assign(ex,{name:rec.name,target:rec.target,start:rec.start,deadline:rec.deadline})}
  else{const n=Object.assign({id:uid(),icon:'target',monthly:0,contribs:[]},rec);S.goals.push(n);o.goalId=n.id}
  return true}
function onbGo(delta){const o=S.settings.onboarding,steps=onbSteps(),i=steps.indexOf(o.step);o.step=steps[clamp(i+delta,0,steps.length-1)];onbErr='';save();renderOnb();window.scrollTo(0,0)}
function onbNext(){if(!onbActive())return;onbSync();onbErr='';const o=S.settings.onboarding,d=onbDraft();
  if(o.step==='profile'){d.name=d.name.trim().slice(0,40);S.settings.name=d.name}
  if(o.step==='currency'&&CURS[d.base])S.settings.base=d.base;
  if(o.step==='start'&&d.mode!=='explore'){const v=parseAmt(d.limit);if(v>0){S.budget.total=v;o.limitSet=true}else if(o.limitSet){S.budget.total=0;o.limitSet=false}}
  if(o.step==='account'&&!onbSaveAcc()){renderOnb();return}
  if(o.step==='goal'&&!onbSaveGoal()){renderOnb();return}
  if(o.step==='review'){onbFinish();return}
  onbGo(1)}
function onbFinish(){const o=S.settings.onboarding;if(!o||o.status!=='inprogress')return;const d=onbDraft();
  S.settings.name=(d.name||'').trim().slice(0,40);S.settings.base=CURS[d.base]?d.base:'IDR';
  if(d.mode==='explore'){const k=S.settings,n=makeSample();n.settings=Object.assign({},n.settings,{name:k.name,base:k.base,theme:k.theme,hide:k.hide,menu:k.menu,onboarding:o});S=n;ensureShape()}
  onbGuardUntil=Date.now()+600;const f=S.settings.onboarding;f.status='done';f.doneAt=new Date().toISOString();f.step='review';delete f.draft;
  save();ui.view='dashboard';ui.month=ym(today());onbErr='';render();window.scrollTo(0,0);toast('Selamat datang di Finora'+(S.settings.name?', '+S.settings.name:'')+'!')}
Object.assign(A,{
  onbnext:()=>onbNext(),onbback:()=>{onbSync();onbGo(-1)},onbskip:()=>{onbSync();onbGo(1)},
  onblater:()=>{onbSync();const o=S.settings.onboarding;o.status='skipped';o.skippedAt=new Date().toISOString();save();ui.view='dashboard';render();toast('Penyiapan ditunda. Lanjutkan kapan saja dari dashboard.')},
  onbresume:()=>{const o=S.settings.onboarding;if(o){o.status='inprogress';save();render()}},
  onbchip:el=>{const i=document.querySelector('#onbform [name=g_name]');if(i){i.value=el.dataset.n;onbSync()}},
  hide:()=>{S.settings.hide=!S.settings.hide;save();render()},
  menuedit:()=>{const ids=menuIds();openModal({title:'Ubah menu utama',body:`<p class="hint" style="margin-top:0">Pilih pintasan yang tampil di dashboard.</p><div class="mcheck">${MENU_ALL.map(x=>`<label><input type="checkbox" name="m_${x.id}" ${ids.includes(x.id)?'checked':''}>${icon(x.icon,18)}${x.label}</label>`).join('')}</div>${FOOT(`<button type="button" class="btn" data-a="menureset">Atur ulang</button>`,'Simpan')}`,
    onSubmit:f=>{const sel=MENU_ALL.filter(x=>f.elements['m_'+x.id].checked).map(x=>x.id);if(!sel.length)return toast('Pilih minimal satu menu');S.settings.menu=sel;done('Menu diperbarui')}})},
  menureset:()=>{delete S.settings.menu;done('Menu dikembalikan ke bawaan')}
});
document.addEventListener('click',e=>{if(Date.now()<onbGuardUntil){e.stopPropagation();e.preventDefault()}},true);
document.addEventListener('submit',e=>{if(e.target&&e.target.id==='onbform'){e.preventDefault();onbNext()}});
document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('#onbform'))onbSync()});
document.addEventListener('change',e=>{const t=e.target;if(!t||!t.closest||!t.closest('#onbform'))return;
  if(t.name==='a_currency'){const m=document.querySelector('#onbform [name=a_opening]');if(m)fmtMoneyInput(m)}
  onbSync();if(t.name==='s_mode')renderOnb()});

/* ============ Events ============ */
document.addEventListener('click',e=>{const t=e.target;if(t.classList&&t.classList.contains('overlay')){closeModal();return}
  const el=t.closest&&t.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f)f(el,e)});
document.addEventListener('input',e=>{const t=e.target;if(t.matches&&t.matches('[data-money]'))fmtMoneyInput(t);
  if(t.dataset&&t.dataset.f==='q'){ui.f.q=t.value;ui.f.limit=80;refreshTx()}});
document.addEventListener('change',e=>{const t=e.target;if(!t||!t.dataset)return;
  if(t.dataset.f){ui.f[t.dataset.f]=t.type==='checkbox'?t.checked:t.value;ui.f.limit=80;refreshTx();return}
  if(t.dataset.set){const k=t.dataset.set;S.settings[k]=t.value;save();if(k==='base')render();return}
  if(t.dataset.rate){const v=parseAmt(t.value);S.settings.rates[t.dataset.rate]=v>0?v:0;save();render();return}
  if(modal&&modal.draft&&t.form&&t.form.id==='mform'){
    if(t.type==='file'&&t.files&&t.files[0]){const isLogo=t.name==='logofile',d=modal.draft;syncDraft(t.form,d);if(d.type!==undefined)syncSplits(t.form,d);
      resizeImage(t.files[0],isLogo?128:720,isLogo?'image/png':'image/jpeg',.72).then(u=>{if(isLogo)d.logo=u;else d.receipt=u;rebuild()}).catch(()=>toast('Gambar tidak bisa dibaca'));return}
    const d=modal.draft;syncDraft(t.form,d);if(t.dataset.rr){if(d.splits!==undefined&&d.type!==undefined)syncSplits(t.form,d);
      if(modal.onRR)modal.onRR(t,d);rebuild()}}});
document.getElementById('modal').addEventListener('submit',e=>{e.preventDefault();if(modal&&modal.onSubmit)modal.onSubmit(e.target)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal()});

/* ============ Render + init ============ */
function applyTheme(){const r=document.documentElement,t=S.settings.theme;if(t==='dark'||t==='light')r.dataset.theme=t;else delete r.dataset.theme;try{const d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches),m=document.querySelector('meta[name=theme-color]');if(m)m.content=d?'#0b0c0a':'#f5f5f2'}catch(e){}}
function render(){missing.clear();applyTheme();const inOb=onbActive();document.body.classList.toggle('onb-on',inOb);if(inOb){renderOnb();return}const ob=$('#onb');if(ob&&ob.innerHTML)ob.innerHTML='';const y=window.scrollY;
  $('#side').innerHTML=sideHTML();$('#view').innerHTML=(views[ui.view]||views.dashboard)();$('#top').innerHTML=topHTML();$('#bnav').innerHTML=bnavHTML();$('#banner').innerHTML=bannerHTML();
  if(modal&&modal.build&&false)renderModal();window.scrollTo(0,y)}
function ensureShape(){const b=blankData();for(const k of Object.keys(b))if(S[k]===undefined)S[k]=b[k];S.settings=Object.assign({},b.settings,S.settings);S.settings.rates=Object.assign({},DEF_RATES,S.settings.rates);
  if(!S.cats.some(c=>c.id==='fees'))S.cats.push({id:'fees',name:'Biaya & Admin',icon:'receipt',color:'#8a96ad',type:'expense',system:true});
  ['other','otherinc'].forEach(id=>{if(!S.cats.some(c=>c.id===id)){const d=defaultCats().find(c=>c.id===id);if(d)S.cats.push(d)}})}
function init(){S=loadData();
  if(!S){try{const raw=localStorage.getItem(KEY);if(raw)localStorage.setItem(KEY+'.unreadable-backup',raw)}catch(e){}
    S=blankData();S.settings.onboarding={status:'inprogress',step:'welcome',draft:{},startedAt:new Date().toISOString()};save()}
  else if(!S.settings||!S.settings.onboarding){S.settings=S.settings||{};S.settings.onboarding={status:'done',legacy:true};save()}
  ensureShape();runRecurring();const h=(location.hash||'').slice(1);if(views[h])ui.view=h;render()}
init();

</script>
